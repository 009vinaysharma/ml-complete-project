<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Churn Predictor</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #e2e8f0;
        margin: 0;
        padding: 32px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background: rgba(15, 23, 42, 0.8);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      }
      h1 {
        margin-top: 0;
      }
      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #cbd5e1;
      }
      input, select {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #475569;
        background: #0f172a;
        color: #fff;
      }
      button {
        margin-top: 18px;
        background: #22c55e;
        border: none;
        color: #052e16;
        padding: 12px 20px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
      }
      .result {
        margin-top: 24px;
        padding: 16px;
        border-radius: 10px;
        background: #111827;
        border: 1px solid #374151;
      }
      .result strong {
        color: #f8fafc;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Customer Churn Predictor</h1>
      <form id="predict-form">
        <div>
          <label>Tenure</label>
          <input type="number" name="tenure" value="{{ default.tenure }}" required />
        </div>
        <div>
          <label>Monthly Charges</label>
          <input type="number" step="0.01" name="monthly_charges" value="{{ default.monthly_charges }}" required />
        </div>
        <div>
          <label>Total Charges</label>
          <input type="number" step="0.01" name="total_charges" value="{{ default.total_charges }}" required />
        </div>
        <div>
          <label>Contract Type</label>
          <select name="contract_type">
            <option value="Month-to-month" selected>Month-to-month</option>
            <option value="One year">One year</option>
            <option value="Two year">Two year</option>
          </select>
        </div>
        <div>
          <label>Internet Service</label>
          <select name="internet_service">
            <option value="Fiber optic" selected>Fiber optic</option>
            <option value="DSL">DSL</option>
            <option value="No">No</option>
          </select>
        </div>
        <div>
          <label>Payment Method</label>
          <select name="payment_method">
            <option value="Electronic check" selected>Electronic check</option>
            <option value="Mailed check">Mailed check</option>
            <option value="Bank transfer">Bank transfer</option>
            <option value="Credit card">Credit card</option>
          </select>
        </div>
        <div>
          <label>Gender</label>
          <select name="gender">
            <option value="Female" selected>Female</option>
            <option value="Male">Male</option>
          </select>
        </div>
        <div>
          <label>Senior Citizen</label>
          <input type="number" name="senior_citizen" value="{{ default.senior_citizen }}" required />
        </div>
        <div>
          <label>Partner</label>
          <input type="number" name="partner" value="{{ default.partner }}" required />
        </div>
        <div>
          <label>Dependents</label>
          <input type="number" name="dependents" value="{{ default.dependents }}" required />
        </div>
      </form>
      <button type="submit" form="predict-form">Predict</button>
      <div id="result" class="result">Result will appear here.</div>
    </div>

    <script>
      const form = document.getElementById('predict-form');
      const resultBox = document.getElementById('result');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);

        const response = await fetch('/predict', {
          method: 'POST',
          body: formData,
        });

        const result = await response.json();

        resultBox.innerHTML = `
          <strong>Prediction:</strong> ${result.predicted_label}<br>
          <strong>Churn Probability:</strong> ${(result.churn_probability * 100).toFixed(2)}%<br>
          <strong>Non-Churn Probability:</strong> ${(result.non_churn_probability * 100).toFixed(2)}%
        `;
      });
    </script>
  </body>
</html>
